<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Envelope Screen -->
    <button type="button" id="envelope-container" aria-label="Open the letter">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <span>♡ Letter for Simmi ♡</span>
    </button>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title" tabindex="-1">Simmi will you be my Valentine?</h1>

        <img src="cat_heart.gif" class="cat" id="letter-cat" alt="Cat holding a heart" />

        <div class="buttons" id="letter-buttons">
          <button type="button" class="btn yes-btn" aria-label="Yes"><img src="yes.png" alt="" /></button>

          <div class="no-wrapper">
            <button type="button" class="btn no-btn" aria-label="No"><img src="no.png" alt="" /></button>
          </div>
        </div>

        <p id="final-text" class="final-text" role="status" style="display: none">
          <strong>Valentine Date:</strong> Sushi at 7-Sisters. Dress fancy!
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
